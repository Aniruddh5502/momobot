[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "momobot"
version = "0.1.0"
description = "Cynical AI Agent with deterministic verification harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langchain-ollama",
    "langgraph",
    "matplotlib",
]

[tool.setuptools]
packages = ["core", "utils", "tools", "ui", "cmd"]
py-modules = ["bootstrap", "config"]

[project.scripts]
momobot = "ui.cli:main"


[project.urls]
Homepage = "https://github.com/Aniruddh5502/momobot"
